{% extends "base.html" %}
{% block title %}Entrar - Projeto social Resendense - Enem{% endblock %}

{% block content %}
<div class="container pagina">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <section class="card card-dark">
                <div class="card-body p-3">
                    <h1 class="h4 mb-2">Entrar</h1>
                    <p class="text-muted small">E-mail e senha da conta.</p>
                    <form method="post" action="{{ url_for('login') }}">
                        <input type="hidden" name="next" value="{{ next or '' }}">
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="email" name="email" required autocomplete="username">
                        </div>
                        <div class="mb-3">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="senha" name="senha" required autocomplete="current-password">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Entrar</button>
                    </form>
                    <p class="mt-3 mb-0">
                        <a href="{{ url_for('recuperar') }}">Esqueci a senha</a>
                        ·
                        <a href="{{ url_for('cadastro') }}">Cadastre-se</a>
                        ·
                        <a href="{{ url_for('faq') }}">FAQ</a>
                    </p>
                </div>
            </section>
        </div>
    </div>
</div>
{% endblock %}
