{% extends "base.html" %}
{% block title %}Recuperar senha - Projeto social Resendense - Enem{% endblock %}

{% block content %}
<div class="container pagina">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <section class="card card-dark">
                <div class="card-body p-4">
                    <h1 class="h3 mb-3">Recuperar senha</h1>
                    <p class="text-muted">Informe o e-mail, o nome da conta e a nova senha.</p>
                    <form method="post" action="{{ url_for('recuperar') }}">
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="email" name="email" required autocomplete="username">
                        </div>
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome cadastrado</label>
                            <input type="text" class="form-control" id="nome" name="nome" required maxlength="120" autocomplete="name">
                        </div>
                        <div class="mb-3">
                            <label for="senha" class="form-label">Nova senha</label>
                            <input type="password" class="form-control" id="senha" name="senha" required minlength="6" autocomplete="new-password">
                        </div>
                        <div class="mb-3">
                            <label for="confirmar" class="form-label">Confirmar nova senha</label>
                            <input type="password" class="form-control" id="confirmar" name="confirmar" required minlength="6" autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Redefinir senha</button>
                    </form>
                    <p class="mt-3 mb-0">
                        <a href="{{ url_for('login') }}">Voltar ao login</a>
                    </p>
                </div>
            </section>
        </div>
    </div>
</div>
{% endblock %}
